org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Studio 2026 embarque un JDK 25 que Gradle 8.11 ne sait pas lire : la synchro
# échoue sur un message vide alors que la ligne de commande passe (gradlew prend
# le java du système). Posé ici — versionné — parce que Studio réécrit
# .gradle/config.properties à chaque ouverture.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
